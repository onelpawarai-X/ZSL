name: ZYRAXON License Attribution and Notice

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  attribution-notice:
    name: Verify license attribution headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm both license texts are present
        run: |
          set -euo pipefail
          for f in ZSL-X-LICENSE MEKRA-X-LICENSE; do
            if [ ! -f "$f" ]; then
              echo "::error::missing license text file: $f"
              exit 1
            fi
          done
          echo "Both license texts are present."

      - name: Reject forbidden commercial terms in the license texts
        run: |
          set -euo pipefail
          # The licenses must never imply a tax, levy, or required payment of any kind.
          if grep -nEi '\b(tax|levy|vat|gst|sales tax)\b' ZSL-X-LICENSE MEKRA-X-LICENSE; then
            echo "::error::a tax-related term is present in a license text"
            exit 1
          fi
          echo "No tax-related terms present."

      - name: Confirm the resale and republish prohibitions survived edits
        run: |
          set -euo pipefail
          for f in ZSL-X-LICENSE MEKRA-X-LICENSE; do
            grep -q 'RESALE PROHIBITED' "$f" || { echo "::error::$f lost the resale prohibition"; exit 1; }
            grep -q 'MODIFIED VERSION PUBLISHING PROHIBITED' "$f" || { echo "::error::$f lost the republish prohibition"; exit 1; }
            grep -q 'MUST NOT' "$f" || { echo "::error::$f lost its systems protections"; exit 1; }
          done
          echo "Resale, republish, and systems protections are intact."

      - name: Confirm the copyright and trademark notice is intact
        run: |
          set -euo pipefail
          for f in ZSL-X-LICENSE MEKRA-X-LICENSE; do
            grep -q 'Copyright (c) 2026 onelpawarai' "$f" || { echo "::error::$f lost the copyright line"; exit 1; }
            grep -q 'ZYRAXON, MEKRA, MYRA' "$f" || { echo "::error::$f lost the trademark line"; exit 1; }
          done
          echo "Copyright and trademark notices are intact."
