name: ZYRAXON License Transition

# ZYRAXON's license family changes edition on a fixed date. This workflow does NOT silently
# rewrite anyone's terms: on the transition date it verifies that the successor text is in
# place, then opens a tracked change for the Licensor to review and merge. Nothing is pushed
# to the software repository automatically, and no existing copy is retroactively relicensed.
#
# Scheduled for the transition date. To change the date, edit the schedule below and the
# TRANSITION_DATE constant in the script step.

on:
  schedule:
    # 1 January at 00:10 UTC, every year. The job no-ops until the date below is reached.
    - cron: "10 0 1 1 *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the transition check now, ignoring the date"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  transition-check:
    name: Prepare the MEKRA-X transition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the transition date has arrived
        id: gate
        run: |
          set -euo pipefail
          TRANSITION_DATE="2028-01-01"
          TODAY="$(date -u +%Y-%m-%d)"
          FORCE="${{ inputs.force }}"

          if [ "$TODAY" \< "$TRANSITION_DATE" ]; then
            echo "::notice::Today is $TODAY. The transition date is $TRANSITION_DATE. Nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TODAY" \> "$TRANSITION_DATE" ] && [ "$FORCE" != "true" ]; then
            echo "::warning::The transition date $TRANSITION_DATE has passed without this workflow having run. Opening a catch-up issue."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "catchup=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Transition date reached. Preparing the change."
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "catchup=false" >> "$GITHUB_OUTPUT"

      - name: Verify the successor license is in place
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          [ -f MEKRA-X-LICENSE ] || { echo "::error::MEKRA-X-LICENSE is missing"; exit 1; }
          grep -q 'MEKRA-X LICENSE' MEKRA-X-LICENSE || { echo "::error::MEKRA-X-LICENSE does not identify itself as MEKRA-X"; exit 1; }
          echo "The successor license text is present and self-identifying."

      - name: Create a transition branch
        if: steps.gate.outputs.ready == 'true'
        id: branch
        run: |
          set -euo pipefail
          BRANCH="license/transition-mekra-x-$(date -u +%Y%m%d)"
          git config user.name "zyraxon-bot"
          git config user.email "zyraxon-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Record the transition in the changelog
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## License transition — $(date -u +%Y-%m-%d)"
            echo ""
            echo "The scheduled MEKRA-X transition date has been reached. The successor license"
            echo "text is present in this repository as \`MEKRA-X-LICENSE\`."
            echo ""
            echo "No terms change retroactively for copies obtained before this date."
            echo "Review the successor text and merge this branch to record the transition."
          } >> README.md

      - name: Open a pull request for review
        if: steps.gate.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.branch.outputs.name }}
          title: "License transition: MEKRA-X edition is now current"
          commit-message: "chore(license): prepare MEKRA-X transition"
          body: |
            The scheduled license transition date has been reached.

            - The successor license text is already committed in this repository.
            - This pull request records the transition in the README.
            - Review the successor text before merging.

            No terms are applied retroactively to copies obtained before the transition date.
          labels: license

      - name: Report to the software repository
        if: steps.gate.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = 'onelpawarai-X/ZYRAXON-AI'
            const body = [
              '## License transition notice',
              '',
              'The MEKRA-X transition date has been reached and the license repository has',
              'prepared the successor edition for review.',
              '',
              `- License repository: https://github.com/onelpawarai-X/ZSL`,
              `- Successor text: ${'MEKRA-X-LICENSE'}`,
              '',
              'No terms change retroactively for copies obtained before the transition date.',
            ].join('\n')
            try {
              await github.rest.issues.create({ owner: 'onelpawarai-X', repo, title: 'License transition: MEKRA-X edition', body })
              core.info('Opened transition notice on the software repository.')
            } catch (error) {
              core.warning(`Could not open the notice issue: ${error.message}`)
            }
